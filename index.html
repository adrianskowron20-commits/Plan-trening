<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f4f0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Plan Adriana</title>
<style>
:root{
  --bg:#f5f4f0;--card:#ffffff;--ink:#1b1b1a;--muted:#6b6a66;--line:#e3e1db;
  --acc:#2f6fdc;--accInk:#ffffff;--good:#2e9e5b;--warn:#d9a21b;--bad:#c94a3a;
  --warm:#e7f1fb;--warmInk:#1d5fa8;--cardio:#f9ece7;--cardioInk:#b4532a;
  --prop:#8f8b80;--chip:#ecebe6;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121212;--card:#1c1c1b;--ink:#f1efe9;--muted:#a3a19a;--line:#32312e;
    --acc:#5b8ff0;--accInk:#0d0d0d;--good:#4cc27c;--warn:#e9bb42;--bad:#e46c5c;
    --warm:#16263a;--warmInk:#8fbcf0;--cardio:#38211a;--cardioInk:#f0a27e;
    --prop:#8a8679;--chip:#2a2a28;
  }
}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:max(12px,calc(env(safe-area-inset-top) + 6px)) 16px 24px}
h1{font-size:22px;margin:8px 0 2px;letter-spacing:-.01em}
h2{font-size:17px;margin:22px 0 8px}
h3{font-size:15px;margin:0}
p{margin:6px 0}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button{font:inherit;color:inherit}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--acc);color:var(--accInk);cursor:pointer;width:100%}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.small{width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
.link{background:none;border:0;color:var(--acc);padding:4px 0;font-size:14px;cursor:pointer}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;flex:none;transform:translateY(-1px)}
.dot.c{background:var(--good)}.dot.i{background:var(--warn)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tag.up{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);font-weight:600}
.block{margin:14px 0}
.bhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 6px}
.bhead b{font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.bhead span{font-size:13px;color:var(--muted)}
.ss{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.ex{padding:12px 14px}
.ex+.ex{border-top:1px dashed var(--line)}
.ssjoin{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:0 14px}
.exhead{display:flex;gap:10px}
.fig{width:96px;height:82px;flex:none;overflow:visible;color:var(--ink)}
.fig .bd{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.fig .hd{fill:none;stroke:var(--ink);stroke-width:3}
.fig .pr{fill:none;stroke:var(--prop);stroke-opacity:.55;stroke-width:5;stroke-linecap:round}
.fig .mvp{fill:none;stroke:var(--prop);stroke-linecap:round}
.fig .wt{fill:var(--acc)}
.fig .gl{stroke:var(--line);stroke-width:1.5}
.exname{font-weight:600;line-height:1.3}
.exmeta{font-size:13px;color:var(--muted);margin-top:3px}
.last{font-size:13px;color:var(--muted);margin-top:6px}
.sets{display:grid;grid-template-columns:64px 1fr 1fr;gap:6px 8px;margin-top:10px;align-items:center}
.sets label{font-size:13px;color:var(--muted)}
.sets input{width:100%;font:inherit;font-size:17px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.sets input:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.sethdr{font-size:12px;color:var(--muted);text-align:center}
.warm{background:var(--warm);border-color:transparent}
.warm .bhead b,.warmInk{color:var(--warmInk)}
.cardioBox{background:var(--cardio);border-color:transparent}
.cardioInk{color:var(--cardioInk)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.chk input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--acc)}
.chk.done span{color:var(--muted);text-decoration:line-through}
.timer{position:sticky;top:env(safe-area-inset-top);z-index:5;background:var(--bg);padding:8px 0;margin:0 -2px}
.timer .card{margin:0;padding:10px 12px}
.tbtns{display:flex;gap:5px;flex:1}
.tbtns button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 0;font-size:14px;cursor:pointer}
.tdisp{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;min-width:64px}
.tdisp.run{color:var(--acc)}
.tdisp.end{color:var(--good)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 10px;cursor:pointer;min-width:64px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hl td{font-weight:700}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0}
details>summary{list-style:none;padding:14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";color:var(--muted);font-weight:400;font-size:20px;line-height:1}
details[open]>summary::after{content:"–"}
details>.in{padding:0 14px 14px}
ul.clean{margin:6px 0;padding-left:18px}
ul.clean li{margin:5px 0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.form input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.form label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.list .it:last-child{border-bottom:0}
.x{background:none;border:0;color:var(--muted);font-size:20px;padding:0 6px;cursor:pointer}
.meal{padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal b{font-weight:600}
.cols{display:grid;gap:10px}
.good{color:var(--good)}.bad{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.sel{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}

/* ---------- motion ---------- */
:root{--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.56,.64,1)}
html,body{overflow-x:hidden;overflow-x:clip}
#app{min-height:100vh;background:var(--bg);position:relative}
.leaving{background:var(--bg);pointer-events:none;will-change:transform,opacity}
.btn,.chip,.tbtns button,nav button,.link,.x{transition:transform .15s var(--ease),background-color .25s,color .25s,border-color .25s;-webkit-tap-highlight-color:transparent}
.btn:active,.chip:active,.tbtns button:active{transform:scale(.95)}
.link:active,.x:active{transform:scale(.92)}
nav{overflow:hidden}
#navInd{position:absolute;top:6px;left:0;height:32px;border-radius:999px;background:color-mix(in srgb,var(--acc) 14%,transparent);transition:transform .42s var(--ease),width .42s var(--ease);pointer-events:none}
nav button{position:relative;z-index:1}
nav button svg{transition:transform .35s var(--spring)}
nav button.on svg{transform:translateY(-1px) scale(1.1)}
nav button:active svg{transform:scale(.85)}
details>summary::after{content:"+";transition:transform .3s var(--ease)}
details[open]>summary::after{content:"+";transform:rotate(45deg)}
details>.in{overflow:hidden}
.chk span{transition:color .25s}
.chk input:checked{animation:pop .32s var(--spring)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.sets input{transition:border-color .25s,background-color .25s,box-shadow .2s}
.sets input:not(:placeholder-shown){border-color:color-mix(in srgb,var(--good) 55%,var(--line));background:color-mix(in srgb,var(--good) 7%,var(--bg))}
.okb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--good);color:#fff;font-size:12px;font-weight:700;margin-left:6px;vertical-align:1px;transform:scale(0);opacity:0;transition:transform .4s var(--spring),opacity .2s}
.ex.complete .okb{transform:scale(1);opacity:1}
.ex{transition:background-color .4s}
.ex.complete{background:color-mix(in srgb,var(--good) 5%,transparent)}
.tprog{height:3px;border-radius:2px;background:var(--chip);margin-top:8px;overflow:hidden}
.tprog i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s linear}
.tbtns button.on{border-color:var(--acc);color:var(--acc)}
.tdisp{transition:color .3s}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent);transform:scale(1)}40%{transform:scale(1.03)}100%{box-shadow:0 0 0 14px transparent;transform:scale(1)}}
.timer .card.done{animation:ring .7s var(--ease) 2}
.toast{transition:opacity .25s,transform .45s var(--spring)}
.toast:not(.show){transform:translateX(-50%) translateY(16px) scale(.96)}
.anim .bar i{animation:grow 1s var(--ease) .25s both}
@keyframes grow{from{width:0}}
.anim .chart svg{animation:reveal 1.1s var(--ease) .2s both}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -4px 0 0)}}
.newpt{transform-box:fill-box;transform-origin:center;animation:ptpop .5s var(--spring)}
@keyframes ptpop{0%{transform:scale(0)}100%{transform:scale(1)}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 2px}
.week button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;min-width:0;transition:transform .15s var(--ease),background-color .25s,border-color .25s;-webkit-tap-highlight-color:transparent}
.week button:active{transform:scale(.92)}
.week .wd{font-size:11px;color:var(--muted)}
.week .dn{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.week .wt{font-size:10px;font-weight:600;padding:1px 5px;border-radius:6px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.week .tA .wt,.week .tB .wt,.week .tC .wt{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.week .tK .wt{background:var(--cardio);color:var(--cardioInk)}
.week .tR .wt{color:var(--muted)}
.week button.tR{background:transparent;border-style:dashed}
.week button.today .dn{color:var(--acc)}
.week button.on{background:var(--ink);border-color:var(--ink);border-style:solid}
.week button.on .wd,.week button.on .dn{color:var(--bg)}
.week button.on .wt{background:color-mix(in srgb,var(--bg) 22%,transparent);color:var(--bg)}
.week .ck{position:absolute;top:-6px;right:-4px;width:17px;height:17px;border-radius:50%;background:var(--good);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.week .missed .wt{text-decoration:line-through;opacity:.7}
.weekmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:0 2px}
.dayhead{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 0;gap:8px}
.dayhead h2{margin:0}
.donebar{background:color-mix(in srgb,var(--good) 12%,var(--card));border-color:transparent;color:var(--good);font-weight:600}
.restBox{display:flex;gap:12px;align-items:flex-start}
.subprev{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 10px 6px 6px;border:1px dashed var(--line);border-radius:10px;background:none;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.subprev .fig{width:54px;height:46px}
.subprev .small{line-height:1.3}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
input,select,textarea{-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
  <span id="navInd"></span>
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>Trening</button>
  <button data-tab="prog"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M7 15l4-4 3 3 5-6"/></svg>Postęp</button>
  <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 2-2 6 0 8v10"/></svg>Jedzenie</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Plan</button>
</nav>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ---------- storage ---------- */
const KEY='planAdriana_v1';
let S={};
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
  S.sessions=S.sessions||[];
  S.weights=S.weights||[{d:'2026-11-21',kg:102,w:null}];
  S.shop=S.shop||{};
  S.draft=S.draft||{};
  S.ui=S.ui||{};
  S.ov=S.ov||{};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtD=s=>parseD(s.slice(0,10)).toLocaleDateString('pl-PL',{day:'numeric',month:'short'});
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const fmtN=n=>n==null?'–':(Math.round(n*10)/10).toString().replace('.',',');
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200)}

/* ---------- stick figures (animated) ---------- */
function body(p){
  let d=`M${p[8]} ${p[9]}L${p[6]} ${p[7]}L${p[4]} ${p[5]}L${p[2]} ${p[3]}L${p[10]} ${p[11]}L${p[12]} ${p[13]}`;
  if(p.length>14)d+=`M${p[4]} ${p[5]}L${p[14]} ${p[15]}L${p[16]} ${p[17]}`;
  if(p.length>18)d+=`M${p[2]} ${p[3]}L${p[18]} ${p[19]}L${p[20]} ${p[21]}`;
  return d;
}
const AN='dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"';
const an=(a,x,y)=>`<animate attributeName="${a}" values="${x};${y};${x}" ${AN}/>`;
function fig(f){
  if(!f)return '';
  const A=f.A,B=f.B;
  let s=`<svg viewBox="0 0 176 150" class="fig" aria-hidden="true"><line x1="10" x2="166" y1="140" y2="140" class="gl"/>`;
  (f.st||[]).forEach(d=>s+=`<path d="${d}" class="pr"/>`);
  (f.mv||[]).forEach(m=>s+=`<path d="${m[0]}" class="mvp" style="stroke-width:${m[2]||1.5}">${an('d',m[0],m[1])}</path>`);
  (f.ink||[]).forEach(d=>s+=`<path d="${d}" class="bd"/>`);
  s+=`<path d="${body(A)}" class="bd">${an('d',body(A),body(B))}</path>`;
  s+=`<circle cx="${A[0]}" cy="${A[1]}" r="8" class="hd">${an('cx',A[0],B[0])}${an('cy',A[1],B[1])}</circle>`;
  (f.w||[]).forEach(([r,j])=>s+=`<circle cx="${A[j]}" cy="${A[j+1]}" r="${r}" class="wt">${an('cx',A[j],B[j])}${an('cy',A[j+1],B[j+1])}</circle>`);
  return s+'</svg>';
}
const STAND=[92,28,90,40,88,78,90,108,90,138,91,62,91,84];
const ROW_A=[112,76,100,80,60,84,54,110,50,138,100,102,100,124],ROW_B=[112,76,100,80,60,84,54,110,50,138,80,64,80,86];
const BENCH_LIE=[46,98,60,102,100,102,118,88,126,138,60,76,60,50];
const LP_SEAT=['M60 122L26 86','M50 116L50 138'];
const F={
  sq:{A:[88,28,88,40,88,78,88,108,88,138,72,56,76,44],B:[100,68,94,80,72,112,106,118,88,138,78,96,82,84],w:[[9,12]]},
  ip:{A:[39,60,45,70,65,105,95,103,98,138,30,82,50,66],B:[39,60,45,70,65,105,95,103,98,138,64,58,82,46],st:['M72 114L50 76','M72 114L104 114','M88 114L88 138'],w:[[5,12]]},
  cr:{A:[106,68,96,78,66,104,48,120,34,138,98,98,98,120],B:[106,68,96,78,66,104,48,120,34,138,78,66,84,88],st:['M60 120L104 82','M80 104L80 138'],w:[[5,12]]},

function startTimer(sec){
  try{T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)();T.ac.resume&&T.ac.resume()}catch(e){}
  T.dur=sec;T.end=Date.now()+sec*1000;clearInterval(T.iv);T.iv=setInterval(tick,250);tick();
}
function stopTimer(){clearInterval(T.iv);T.end=0;tick()}
function tick(){
  const el=$('#tdisp'),bar=$('#tbar');if(!el)return;
  document.querySelectorAll('.tbtns button[data-t]').forEach(b=>b.classList.toggle('on',!!T.end&&+b.dataset.t===T.dur));
  if(!T.end){el.textContent='0:00';el.className='tdisp';if(bar)bar.style.width='0';return}
  const ms=Math.max(0,T.end-Date.now()),left=Math.ceil(ms/1000);
  el.textContent=Math.floor(left/60)+':'+pad(left%60);
  el.className='tdisp run';
  if(bar)bar.style.width=(ms/(T.dur*1000)*100)+'%';
  if(left<=0){
    clearInterval(T.iv);T.end=0;el.textContent='Start!';el.className='tdisp end';if(bar)bar.style.width='0';
    document.querySelectorAll('.tbtns button').forEach(b=>b.classList.remove('on'));
    const c=el.closest('.card');if(c){c.classList.remove('done');void c.offsetWidth;c.classList.add('done')}
    beep();try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}
  }
}

function finishWorkout(){

const SCEN={
  weak:[102,99.5,98,96.5,95,93.5,92,90.5,89,88,87,86,85,84],
  real:[102,97,94.5,92,90,88,86.5,85,84,83,82.5,82,82,82],

function scenAt(name,dStr){
  const t=parseD(dStr).getTime(),ts=SCEN_D.map(s=>parseD(s).getTime()),v=SCEN[name];
  if(t<=ts[0])return v[0];
  for(let i=1;i<ts.length;i++)if(t<=ts[i]){const f=(t-ts[i-1])/(ts[i]-ts[i-1]);return v[i-1]+f*(v[i]-v[i-1])}
  return v[v.length-1];
}
function chartSVG(){
  const W=340,H=210,L=34,R=10,Tp=12,Bt=26;
  const t0=parseD(SCEN_D[0]).getTime(),t1=parseD(SCEN_D[SCEN_D.length-1]).getTime();
  const x=t=>L+(t-t0)/(t1-t0)*(W-L-R),y=k=>Tp+(104-k)/(104-80)*(H-Tp-Bt);
  const line=(vals,dates)=>vals.map((v,i)=>(i?'L':'M')+x(parseD(dates[i]).getTime()).toFixed(1)+' '+y(v).toFixed(1)).join('');
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wykres wagi na tle trzech scenariuszy">`;
  [100,95,90,85].forEach(k=>s+=`<line x1="${L}" x2="${W-R}" y1="${y(k)}" y2="${y(k)}" stroke="var(--line)"/><text x="${L-6}" y="${y(k)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${k}</text>`);
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(82)}" y2="${y(82)}" stroke="var(--good)" stroke-dasharray="3 3"/><text x="${L-6}" y="${y(82)+4}" font-size="10" text-anchor="end" fill="var(--good)">82</text>`;
  [['2026-12-01','gru'],['2027-03-01','mar'],['2027-06-01','cze'],['2027-09-01','wrz'],['2027-12-01','gru']].forEach(([d,l])=>s+=`<text x="${x(parseD(d).getTime())}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${l}</text>`);
  s+=`<path d="${line(SCEN.weak,SCEN_D)}" fill="none" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".7"/>`;
  s+=`<path d="${line(SCEN.real,SCEN_D)}" fill="none" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".9"/>`;
  s+=`<path d="${line(SCEN.opt,SCEN_D)}" fill="none" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".8"/>`;
  const ws=[...S.weights].sort((a,b)=>a.d.localeCompare(b.d)).filter(w=>parseD(w.d).getTime()>=t0&&parseD(w.d).getTime()<=t1);
  if(ws.length>1)s+=`<path d="${line(ws.map(w=>w.kg),ws.map(w=>w.d))}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>`;
  ws.forEach(w=>s+=`<circle cx="${x(parseD(w.d).getTime())}" cy="${y(Math.max(80,Math.min(104,w.kg)))}" r="3.5" fill="var(--acc)" ${w.d===NEWPT?'class="newpt"':''}/>`);
  return s+'</svg>';
}

/* ---------- motion helpers ---------- */
const EASE='cubic-bezier(.32,.72,0,1)';
const reduce=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const TABS=['train','prog','food','plan'];
const SCROLL={};
let ANIM=false,NEWPT=null,BUSY=false;
function countUp(el){
  const to=+el.dataset.count,from=el.dataset.from!=null?+el.dataset.from:0,pre=el.dataset.pre||'',t0=performance.now(),D=800;
  const step=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);el.textContent=pre+fmtN(from+(to-from)*e);if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function enter(delay){
  if(reduce())return;
  const items=[...app.querySelectorAll(':scope > h1, :scope > .sub, :scope > .card, :scope > details, :scope > h2, #pane > .card, #pane > .block, #pane > details, #pane > h2, #pane > .sub')].slice(0,9);
  items.forEach((el,i)=>el.animate([{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:420,delay:(delay||0)+i*35,easing:EASE,fill:'backwards'}));
}
function moveInd(){
  const ind=$('#navInd'),b=document.querySelector('#nav button.on');if(!ind||!b)return;
  const w=Math.min(64,b.offsetWidth);ind.style.width=w+'px';ind.style.transform=`translateX(${b.offsetLeft+(b.offsetWidth-w)/2}px)`;
}
/* iOS-style push: forward = new screen slides in from the right over the old one; back = old slides away to the right */
function slideScreen(fn,dir){
  if(reduce()||!dir){fn();window.scrollTo(0,SCROLL[S.ui.tab]||0);return}
  BUSY=true;
  const r=app.getBoundingClientRect(),W=window.innerWidth;
  const old=app.cloneNode(true);old.removeAttribute('id');old.classList.remove('anim');old.classList.add('leaving');
  old.style.cssText=`position:fixed;top:${r.top}px;left:${r.left}px;width:${r.width}px;margin:0;z-index:${dir>0?1:3}`;
  old.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  document.body.appendChild(old);
  fn();
  window.scrollTo(0,SCROLL[S.ui.tab]||0);
  app.style.zIndex=dir>0?3:1;
  const dur=420,shadow='0 0 28px rgba(0,0,0,.14)';
  let a1,a2;
  if(dir>0){
    a1=app.animate([{transform:`translateX(${W}px)`,boxShadow:shadow},{transform:'translateX(0)',boxShadow:shadow}],{duration:dur,easing:EASE});
    a2=old.animate([{transform:'translateX(0)',opacity:1},{transform:`translateX(${-W*.28}px)`,opacity:.4}],{duration:dur,easing:EASE,fill:'forwards'});
  }else{
    a1=app.animate([{transform:`translateX(${-W*.28}px)`,opacity:.4},{transform:'translateX(0)',opacity:1}],{duration:dur,easing:EASE});
    a2=old.animate([{transform:'translateX(0)',boxShadow:shadow},{transform:`translateX(${W}px)`,boxShadow:shadow}],{duration:dur,easing:EASE,fill:'forwards'});
  }
  a2.onfinish=()=>{old.remove();app.style.zIndex='';BUSY=false};
}
/* in-screen content change (day, food section): slide the pane in the direction of travel */
function paneSwap(fn,dir){
  const y=window.scrollY;fn();window.scrollTo(0,y);
  const p=$('#pane');if(!p||reduce())return;
  p.animate([{opacity:0,transform:`translateX(${dir*36}px)`},{opacity:1,transform:'none'}],{duration:340,easing:EASE});
}
function scrollChip(sel){const c=app.querySelector(sel);if(c&&c.scrollIntoView)c.scrollIntoView({inline:'center',block:'nearest',behavior:reduce()?'auto':'smooth'})}

app.addEventListener('click',e=>{
  const s=e.target.closest('summary');if(!s)return;
  const d=s.parentElement,inn=d.querySelector('.in');if(!inn)return;
  e.preventDefault();
  if(reduce()){d.open=!d.open;return}
  if(d._a)d._a.cancel();
  if(!d.open){
    d.open=true;const h=inn.scrollHeight;
    d._a=inn.animate([{height:'0px',opacity:0,transform:'translateY(-6px)'},{height:h+'px',opacity:1,transform:'none'}],{duration:340,easing:EASE});
    d._a.onfinish=()=>d._a=null;
  }else{
    const h=inn.scrollHeight;
    d._a=inn.animate([{height:h+'px',opacity:1},{height:'0px',opacity:0}],{duration:260,easing:EASE});
    d._a.onfinish=()=>{d.open=false;d._a=null};
  }
});

  if(t.dataset.wdel){const [d,kg]=t.dataset.wdel.split('|');if(!confirm('Usunąć pomiar z '+fmtD(d)+'?'))return;const row=t.closest('.it');const done=()=>{S.weights=S.weights.filter(x=>!(x.d===d&&String(x.kg)===kg));save();const y=window.scrollY;renderProg();window.scrollTo(0,y)};if(row&&!reduce())row.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateX(40px)'}],{duration:220,easing:EASE}).onfinish=done;else done();return}
  if(t.dataset.food){const o=['meals','order','sweet','shop'],cur=S.ui.food||'meals',nx=t.dataset.food;if(nx===cur)return;S.ui.food=nx;save();buzz(8);paneSwap(renderFood,o.indexOf(nx)>o.indexOf(cur)?1:-1);enter(60);scrollChip(`[data-food="${nx}"]`);return}
  if(t.dataset.meal){const o=['Śniadanie','Obiad','Kolacja','Przekąska'],cur=S.ui.meal||'Śniadanie',nx=t.dataset.meal;if(nx===cur)return;S.ui.meal=nx;save();const y=window.scrollY;renderFood();window.scrollTo(0,y);const l=$('#mealList');if(l&&!reduce()){const dir=o.indexOf(nx)>o.indexOf(cur)?1:-1;[...l.children].forEach((c,i)=>c.animate([{opacity:0,transform:`translateX(${dir*28}px)`},{opacity:1,transform:'none'}],{duration:340,delay:i*30,easing:EASE,fill:'backwards'}))}scrollChip(`[data-meal="${nx}"]`);return}
  if(t.id==='shopClear'){if(!confirm('Odznaczyć całą listę zakupów?'))return;S.shop={};save();const y=window.scrollY;renderFood();window.scrollTo(0,y);return}
  if(t.id==='exp'){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='plan-adriana-kopia-'+todayStr()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return}
  if(t.id==='impB'){$('#imp').click();return}
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k){
    const day=S.ui.day,dr=draft(day),k=t.dataset.k,s=+t.dataset.s,f=+t.dataset.f;dr.v[k]=dr.v[k]||[['',''],['',''],['','']];dr.v[k][s]=dr.v[k][s]||['',''];dr.v[k][s][f]=t.value;save();
    const ex=t.closest('.ex');if(ex){const timed=!!ex.dataset.timed,vals=dr.v[k];const c=[0,1,2].every(i=>{const v=vals[i];return v&&v[1]!==''&&(timed||v[0]!=='')});if(c&&!ex.classList.contains('complete'))buzz([12,40,12]);ex.classList.toggle('complete',c)}
    return}
  if(t.id==='kMin'){draft('K').min=t.value;save();return}
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.warm!=null){const dr=draft(S.ui.day);dr.warm[+t.dataset.warm]=t.checked;t.closest('.chk').classList.toggle('done',t.checked);save();if(t.checked)buzz(8);return}
  if(t.id==='cdone'){draft(S.ui.day).cardio.done=t.checked;t.closest('.chk').classList.toggle('done',t.checked);save();if(t.checked)buzz(8);return}
  if(t.id==='kEq'){draft('K').eq=t.value;save();return}
  if(t.dataset.shop){S.shop[t.dataset.shop]=t.checked;t.closest('.chk').classList.toggle('done',t.checked);save();if(t.checked)buzz(8);const total=SHOP.reduce((a,g)=>a+g[1].length,0),done=Object.values(S.shop).filter(Boolean).length;const el=app.querySelector('.row.between .small');if(el){el.textContent='Zaznaczone: '+done+'/'+total;if(!reduce())el.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:300,easing:EASE})}return}
  if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.sessions))throw 0;if(!confirm('Zastąpić obecne dane kopią z pliku?'))return;localStorage.setItem(KEY,JSON.stringify(d));load();render();toast('Kopia wczytana')}catch(err){toast('To nie jest plik kopii z tej aplikacji')}};r.readAsText(t.files[0])}
});

/* swipe left/right between tabs */
(()=>{
  let sx=0,sy=0,st=0,ok=false;
  app.addEventListener('touchstart',e=>{
    const t=e.target;ok=e.touches.length===1&&!t.closest('.chips,.week,input,select,textarea,.chart,table');
    if(!ok)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();
  },{passive:true});
  app.addEventListener('touchend',e=>{
    if(!ok)return;ok=false;
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8||Date.now()-st>600)return;
    const i=TABS.indexOf(S.ui.tab||'train'),n=i+(dx<0?1:-1);
    if(n>=0&&n<TABS.length)goTab(TABS[n]);
  },{passive:true});
})();

ANIM=true;render();ANIM=false;
{const ind=$('#navInd');ind.style.transition='none';requestAnimationFrame(()=>{moveInd();requestAnimationFrame(()=>ind.style.transition='');enter(0)})}
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
